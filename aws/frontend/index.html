<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LambLink · My Lamb</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#faf8f2;color:#222}
    .card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin:16px 0}
    button{font:inherit;cursor:pointer;font-weight:700}
    .muted{color:#666}.ok{color:#157347}.err{color:#b02a37}
    .picker-section{margin:0 0 22px}.picker-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:18px}
    .picker-help{font-size:12px;color:#777;margin:-3px 0 9px}
    .choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;max-height:280px;overflow:auto;padding:3px 5px 3px 3px;scrollbar-gutter:stable}
    .choice{position:relative;display:flex;align-items:center;justify-content:center;min-height:66px;border:2px solid transparent;border-radius:11px;background:#eee8dc;color:#392f25;padding:9px;box-sizing:border-box;text-align:center;transition:border-color .12s ease,transform .12s ease,background .12s ease}
    .choice:hover{border-color:#e8b54e;transform:translateY(-1px)}.choice.selected{border-color:#ff3b1f;box-shadow:0 0 0 1px #ff3b1f inset;background:#fff8ed}
    .choice.selected::after{content:'✓';position:absolute;top:5px;right:7px;font-size:12px;font-weight:900;color:#ff3b1f}
    .choice.dark{background:#2b2b2b;color:#fff}.choice.dark.selected{background:#333}
    .choice.swatch{flex-direction:column;gap:7px;min-height:88px}
    .choice.has-preview{flex-direction:column;gap:5px;min-height:112px}.choice-preview{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
    .swatch-chip{width:58px;height:43px;border-radius:9px;border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
    .swatch-chip.default{background:linear-gradient(135deg,#eee8dc 0 25%,#d6cec0 25% 50%,#eee8dc 50% 75%,#d6cec0 75%)}
    .label{font-size:12px;line-height:1.25;word-break:keep-all}
    .selection-summary{background:#faf8f2;border:1px solid #e4ded2;border-radius:10px;padding:10px 12px;margin:4px 0 12px;font-size:13px}
    #saveBtn,#loginBtn{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:9px;background:#fff}
    #saveBtn{background:#2f2922;color:#fff;border-color:#2f2922}
    .identity{font-size:20px;font-weight:800;margin:0 0 6px}.eligibility{padding:10px;border-radius:9px;background:#eef8ef}.eligibility.locked{background:#fff0f0}
    .preview{display:grid;place-items:center;min-height:230px;overflow:hidden;background:radial-gradient(circle,#f7e9cb,#cbb58e);border-radius:12px;margin-bottom:18px}
    #previewCanvas{width:220px;height:220px;image-rendering:auto}.history-toolbar{display:flex;justify-content:flex-end;margin:10px 0 14px}.history-toolbar button,.history-header button{padding:8px 11px;border:1px solid #b9aa94;border-radius:9px;background:#fff8ed;color:#392f25}.history-header{display:flex;align-items:center;justify-content:space-between;gap:12px}.history-header h2{margin:0}.history-item{border-top:1px solid #eee;padding:13px 0}.history-item:first-child{border-top:0}.history-events{font-size:13px;color:#555}.history-empty{padding:18px 4px;color:#666;text-align:center}.copyBtn{padding:6px 9px;border:1px solid #bbb;border-radius:7px;background:#fff}
    @media(max-width:520px){body{padding:14px}.card{padding:15px}.choice-grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}.swatch-chip{width:48px;height:38px}}
  </style>
</head>
<body>
  <h1>LambLink · My Lamb</h1>
  <p class="muted">방송에서 당첨되었을 때 사용할 내 신도 외형을 미리 저장합니다.</p>
  <div id="status" class="card">초기화 중...</div>
  <div id="login" class="card" hidden><button id="loginBtn">치지직으로 로그인</button></div>
  <div id="editor" class="card" hidden>
    <p id="followerName" class="identity"></p><p id="eligibility" class="eligibility"></p>
    <div class="history-toolbar"><button id="historyBtn" type="button" aria-controls="historyCard" aria-expanded="false">신도 히스토리 보기 <span id="historyCount">0</span></button></div>
    <div class="preview"><canvas id="previewCanvas" width="440" height="440"></canvas></div>
    <section class="picker-section">
      <div class="picker-title"><strong>형상 선택</strong><span id="formCount" class="muted"></span></div>
      <p class="picker-help">사용할 신도의 형상을 이름으로 선택합니다.</p>
      <div id="formGrid" class="choice-grid"></div>
    </section>
    <section class="picker-section">
      <div class="picker-title"><strong>색 선택</strong><span id="colorCount" class="muted"></span></div>
      <p class="picker-help">게임에서 읽은 실제 색상값을 색상칩으로 표시합니다.</p>
      <div id="colorGrid" class="choice-grid"></div>
    </section>
    <section class="picker-section">
      <div class="picker-title"><strong>종류 선택</strong><span id="variantCount" class="muted"></span></div>
      <p class="picker-help">형상에 존재하는 종류 번호를 선택합니다.</p>
      <div id="variantGrid" class="choice-grid"></div>
    </section>
    <select id="form" hidden></select><select id="variant" hidden></select><select id="color" hidden></select>
    <p id="optionHint" class="selection-summary"></p>
    <button id="saveBtn">이 외형으로 저장</button>
    <p id="saveStatus"></p>
  </div>
  <div id="historyCard" class="card" hidden><div class="history-header"><h2>신도 히스토리</h2><button id="historyCloseBtn" type="button">닫기</button></div><div id="history"></div></div>
<script>
const API_BASE='__API_BASE__';
const PREVIEW_ASSET_BASE='__PREVIEW_ASSET_BASE__';
const CATALOG_POLL_MS=15000;
const qs=new URLSearchParams(location.search),streamer=qs.get('streamer');
const fragment=new URLSearchParams(location.hash.slice(1));
if(fragment.get('token')){sessionStorage.setItem('viewerToken',fragment.get('token'));history.replaceState({},'',location.pathname+location.search)}
const token=()=>sessionStorage.getItem('viewerToken');
const status=document.querySelector('#status'),login=document.querySelector('#login'),editor=document.querySelector('#editor');
const formSel=document.querySelector('#form'),variantSel=document.querySelector('#variant'),colorSel=document.querySelector('#color');
const formGrid=document.querySelector('#formGrid'),variantGrid=document.querySelector('#variantGrid'),colorGrid=document.querySelector('#colorGrid');
let catalog={forms:[]},catalogFingerprint='',loadingCatalog=false,viewerState={canCreate:true,nextGeneration:1,history:[]},previewData=null,atlasImage=null,previewObserver=null,previewCachePixels=0;
const previewCache=new Map(),MAX_PREVIEW_CACHE_PIXELS=8000000;
const FORM_KO={Anteater:'개미핥기',Bee:'벌',Camel:'낙타',Cat:'고양이',Chicken:'닭',Cow:'소',Cthulhu:'크툴루',Deer:'사슴',Deer_ritual:'사슴 (의식)',Dog:'개',Enchida:'가시두더지',Echidna:'가시두더지',Fox:'여우',Goldfish:'금붕어',Gorilla:'고릴라',Hammerhead:'귀상어',Hedgehog:'고슴도치',LadyBug:'무당벌레',Ladybug:'무당벌레',Llama:'라마',Monkey:'원숭이',Moose:'말코손바닥사슴',Mosquito:'모기',Narwal:'일각고래',Narwhal:'일각고래',Panda:'판다',Pig:'돼지',Poppy:'포피',Possum:'주머니쥐',Rabbit:'토끼',Skunk:'스컹크',Sphynx:'스핑크스 고양이',Tapir:'맥',Tiger:'호랑이',Turtle:'거북이'};
function msg(t,c=''){status.className='card '+c;status.textContent=t}
function koreanFormName(f){return FORM_KO[f.formId]||FORM_KO[f.displayName]||f.displayName||f.formId}
function optionLabel(kind,id,index){const n=Number(id);if(kind==='variant')return Number.isInteger(n)&&String(n)===String(id)?`종류 ${n+1}`:`종류 ${index+1}`;if(kind==='color')return Number.isInteger(n)&&String(n)===String(id)?`색상 ${n+1}`:`색상 ${index+1}`;return String(id)}
function normalizeCatalog(raw){const rawForms=raw.forms||raw.Forms||[],allowedRaw=raw.allowedFormIds||raw.AllowedFormIds||[];const forms=rawForms.map(x=>({formId:String(x.formId??x.FormId??''),displayName:x.displayName??x.DisplayName??'',isUnlocked:x.isUnlocked??x.IsUnlocked??true,isSpecial:x.isSpecial??x.IsSpecial??false,isModded:x.isModded??x.IsModded??false,variantIds:(x.variantIds??x.VariantIds??[]).map(String),colorIds:(x.colorIds??x.ColorIds??[]).map(String),colorHexById:x.colorHexById??x.ColorHexById??{}})).filter(x=>x.formId);return {...raw,forms,allowedFormIds:allowedRaw.map(String),saveId:raw.saveId??raw.SaveId??'unknown'}}
function fingerprint(c){return JSON.stringify({s:c.saveId,a:c.allowedFormIds,f:c.forms.map(x=>[x.formId,x.displayName,x.isUnlocked,x.isSpecial,x.isModded,x.variantIds,x.colorIds,x.colorHexById])})}
function allowedForms(){const allowed=new Set((catalog.allowedFormIds||[]).map(String));return (catalog.forms||[]).filter(x=>x.isUnlocked&&allowed.has(x.formId))}
function setGridSelection(grid,value){for(const b of grid.children){const selected=b.dataset.value===String(value??'');b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',selected?'true':'false')}}
function drawMiniPlaceholder(c,text='미리보기 대기 중'){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#766';x.textAlign='center';x.font='13px sans-serif';x.fillText(text,72,76)}
function renderQueuedMini(c){if(c.dataset.rendered==='1'||!atlasImage||!previewData)return;renderMini(c,c.dataset.formId,c.dataset.variantId,null);c.dataset.rendered='1';previewObserver?.unobserve(c)}
function renderVisibleMinis(){for(const c of document.querySelectorAll('.choice-preview:not([data-rendered="1"])')){const r=c.getBoundingClientRect();if(r.bottom>=0&&r.top<=innerHeight)renderQueuedMini(c)}}
function observeMini(c){drawMiniPlaceholder(c);if(!previewObserver&&'IntersectionObserver'in window){previewObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)renderQueuedMini(e.target)}),{rootMargin:'160px'})}if(previewObserver)previewObserver.observe(c);else requestAnimationFrame(()=>renderQueuedMini(c))}
function makeChoice(label,value,selected,onClick,{dark=false,color=null,defaultSwatch=false,preview=null}={}){const b=document.createElement('button');b.type='button';b.dataset.value=String(value??'');b.className='choice'+(dark?' dark':'')+((color||defaultSwatch)?' swatch':'')+(preview?' has-preview':'')+(selected?' selected':'');b.setAttribute('aria-pressed',selected?'true':'false');if(preview){const canvas=document.createElement('canvas');canvas.width=144;canvas.height=144;canvas.className='choice-preview';canvas.dataset.formId=preview.formId;canvas.dataset.variantId=preview.variantId||'0';b.appendChild(canvas);observeMini(canvas)}if(color||defaultSwatch){const chip=document.createElement('div');chip.className='swatch-chip'+(defaultSwatch?' default':'');if(color)chip.style.background=color;b.appendChild(chip)}const t=document.createElement('span');t.className='label';t.textContent=label;b.appendChild(t);b.onclick=onClick;return b}
function currentForm(){return (catalog.forms||[]).find(x=>x.formId===formSel.value)}
function fillOptions(select,ids,includeEmpty=false){select.innerHTML='';if(includeEmpty){const empty=document.createElement('option');empty.value='';select.appendChild(empty)}for(const id of ids){const o=document.createElement('option');o.value=id;select.appendChild(o)}}
function syncDependentOptions(preferredVariant='',preferredColor=''){const f=currentForm(),variants=f?.variantIds||[],colors=f?.colorIds||[];fillOptions(variantSel,variants,true);fillOptions(colorSel,colors,true);variantSel.value=variants.includes(String(preferredVariant))?String(preferredVariant):(variants[0]||'');colorSel.value=colors.includes(String(preferredColor))?String(preferredColor):''}
function updateSelection(){const f=currentForm(),ids=f?.variantIds||[],variantIndex=ids.indexOf(variantSel.value);document.querySelector('#optionHint').textContent=f?`현재 선택: ${koreanFormName(f)} · ${colorSel.value?optionLabel('color',colorSel.value,Number(colorSel.value)||0):'게임 기본 색상'} · ${variantIndex>=0?`종류 ${variantIndex+1}`:'종류 없음'}`:'';renderPreview()}
function selectForm(formId,variantId='',colorId=''){formSel.value=formId;syncDependentOptions(variantId,colorId);setGridSelection(formGrid,formSel.value);renderColors();renderVariants();updateSelection()}
function selectColor(colorId){colorSel.value=colorId;setGridSelection(colorGrid,colorSel.value);updateSelection()}
function selectVariant(variantId){variantSel.value=variantId;setGridSelection(variantGrid,variantSel.value);updateSelection()}
function renderForms(){formGrid.innerHTML='';const forms=allowedForms();document.querySelector('#formCount').textContent=`${forms.length}개`;forms.forEach(f=>formGrid.appendChild(makeChoice(koreanFormName(f),f.formId,formSel.value===f.formId,()=>selectForm(f.formId),{preview:{formId:f.formId,variantId:(f.variantIds||[])[0]||'0'}})))}
function renderColors(){colorGrid.innerHTML='';const f=currentForm(),ids=f?.colorIds||[];document.querySelector('#colorCount').textContent=`${ids.length}색`;colorGrid.appendChild(makeChoice('게임 기본','',!colorSel.value,()=>selectColor(''),{dark:true,defaultSwatch:true}));ids.forEach((id,i)=>{const hex=f?.colorHexById?.[id]||null;colorGrid.appendChild(makeChoice(optionLabel('color',id,i),id,colorSel.value===id,()=>selectColor(id),{dark:true,color:hex}))})}
function renderVariants(){variantGrid.innerHTML='';const f=currentForm(),ids=f?.variantIds||[];document.querySelector('#variantCount').textContent=`${ids.length}개`;ids.forEach((id,i)=>variantGrid.appendChild(makeChoice(`종류 ${i+1}`,id,variantSel.value===id,()=>selectVariant(id),{preview:{formId:f?.formId||'',variantId:id}})))}
function renderAll(){renderForms();renderColors();renderVariants();updateSelection()}
function renderCatalog(next,changed=false){catalog=next;const forms=allowedForms(),pf=formSel.value,pv=variantSel.value,pc=colorSel.value;if(!forms.length){editor.hidden=true;msg(`현재 선택 가능한 외형이 없습니다. (수신 forms=${next.forms.length}, allowed=${(next.allowedFormIds||[]).length})`,'err');return}fillOptions(formSel,forms.map(f=>f.formId));formSel.value=pf&&forms.some(f=>f.formId===pf)?pf:forms[0].formId;syncDependentOptions(pv,pc);if(!token()){editor.hidden=true;login.hidden=false;msg(`선택 가능 외형 ${forms.length}개 · 목록 자동 갱신 중`);return}renderAll();login.hidden=true;editor.hidden=false;msg(changed?`외형 목록이 갱신되었습니다. 선택 가능 ${forms.length}개`:`선택 가능 외형 ${forms.length}개 · 자동 갱신 중`,'ok')}
async function refreshCatalog(initial=false){if(!streamer||loadingCatalog)return;loadingCatalog=true;try{const r=await fetch(`${API_BASE}/streamers/${encodeURIComponent(streamer)}/catalog`,{cache:'no-store'});if(!r.ok){if(initial){editor.hidden=true;msg('스트리머의 외형 목록이 아직 업로드되지 않았습니다. 게임과 Companion을 먼저 실행해 주세요. 자동으로 다시 확인합니다.','err')}return}const next=normalizeCatalog(await r.json()),fp=fingerprint(next),changed=!!catalogFingerprint&&fp!==catalogFingerprint;if(initial||fp!==catalogFingerprint){catalogFingerprint=fp;renderCatalog(next,changed)}}catch(e){if(initial)msg('외형 목록 조회 오류: '+e.message+' · 자동으로 다시 확인합니다.','err')}finally{loadingCatalog=false}}
function decodeBase64UrlUtf8(value){const base64=value.replace(/-/g,'+').replace(/_/g,'/'),padded=base64+'='.repeat((4-base64.length%4)%4),bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}
function viewerNickname(){try{const value=token();return value?(JSON.parse(decodeBase64UrlUtf8(value.split('.')[0])).nickname||'시청자'):'시청자'}catch{return '시청자'}}
function displayName(){const g=Number(viewerState.nextGeneration||1),n=viewerNickname();return g<=1?n:`${n} ${g}세`}
async function loadViewerState(){if(!token())return;const r=await fetch(`${API_BASE}/streamers/${encodeURIComponent(streamer)}/appearance/me`,{cache:'no-store',headers:{authorization:`Bearer ${token()}`}});if(!r.ok)throw new Error('신도 상태 조회 실패');viewerState=await r.json();const saved=viewerState.appearance;if(saved&&allowedForms().some(f=>f.formId===saved.formId))selectForm(saved.formId,saved.variantId||'',saved.colorId||'');renderViewerState()}
function setHistoryOpen(open){const card=document.querySelector('#historyCard'),button=document.querySelector('#historyBtn');card.hidden=!open;button.setAttribute('aria-expanded',open?'true':'false');button.firstChild.textContent=open?'신도 히스토리 닫기 ':'신도 히스토리 보기 ';if(open)card.scrollIntoView({behavior:'smooth',block:'start'})}
function renderViewerState(){const can=viewerState.canCreate!==false;document.querySelector('#followerName').textContent=`신도 이름 : ${displayName()}`;const el=document.querySelector('#eligibility');el.className='eligibility'+(can?'':' locked');el.textContent=can?'새 신도를 생성할 수 있습니다. 저장된 최신 외형이 래플 당첨 시 사용됩니다.':'현재 세대의 사망이 확정되기 전에는 새 신도를 생성할 수 없습니다.';document.querySelector('#saveBtn').disabled=!can;const box=document.querySelector('#history'),items=viewerState.history||[];document.querySelector('#historyCount').textContent=`(${items.length})`;box.innerHTML='';if(!items.length){const empty=document.createElement('p');empty.className='history-empty';empty.textContent='아직 생성된 신도 히스토리가 없습니다.';box.appendChild(empty);return}items.forEach(h=>{const d=document.createElement('div');d.className='history-item';const events=(h.events||[]).map(e=>`${escapeHtml(e.type==='Created'?'생성됨':e.type==='Died'?'사망함':e.type==='Resurrected'?'부활함':e.type)} · ${escapeHtml(new Date(e.at).toLocaleString())}${e.cause?' · '+escapeHtml(e.cause):''}`).join('<br>');const lived=(h.events||[]).length?`<br>누적 생존 기간: ${formatDuration(livingDuration(h.events,h.isAlive))}`:'';const look=h.appearance?`<br>외형: ${escapeHtml(h.appearance.formId)} / 색 ${escapeHtml(h.appearance.colorId??'기본')} / 종류 ${escapeHtml(h.appearance.variantId??'기본')}`:'';d.innerHTML=`<strong>${escapeHtml(h.followerName||`${h.generation}세`)}</strong><p class="history-events">${events}${lived}${look}</p>`;if(h.appearance){const b=document.createElement('button');b.className='copyBtn';b.textContent='이 외형을 현재 설정으로 복사';b.onclick=()=>copyAppearance(h.appearance);d.appendChild(b)}box.appendChild(d)})}
function livingDuration(events,isAlive){let start=null,total=0;[...(events||[])].sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(e=>{if((e.type==='Created'||e.type==='Resurrected')&&start===null)start=new Date(e.at).getTime();else if(e.type==='Died'&&start!==null){total+=Math.max(0,new Date(e.at).getTime()-start);start=null}});if(isAlive&&start!==null)total+=Math.max(0,Date.now()-start);return total}
function formatDuration(ms){const days=Math.max(0,Math.floor(ms/86400000)),hours=Math.max(0,Math.floor(ms%86400000/3600000));return `${days}일 ${hours}시간`}
function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function copyAppearance(a){if(viewerState.canCreate===false||!allowedForms().some(f=>f.formId===a.formId))return;selectForm(a.formId,a.variantId||'',a.colorId||'');setHistoryOpen(false);document.querySelector('#saveStatus').textContent='이전 세대 외형을 불러왔습니다. 저장 버튼을 눌러 확정하세요.'}
async function loadPreviewAssets(){try{const [data,img]=await Promise.all([fetch(`${PREVIEW_ASSET_BASE}/Follower.preview.json`).then(r=>{if(!r.ok)throw new Error(`preview metadata ${r.status}`);return r.json()}),new Promise((ok,no)=>{const i=new Image();i.decoding='async';i.onload=()=>ok(i);i.onerror=()=>no(new Error('preview atlas image'));i.src=`${PREVIEW_ASSET_BASE}/Follower.preview.png`})]);if(data.version!==1)throw new Error(`unsupported preview metadata ${data.version}`);previewData=data;atlasImage=img;renderPreview();renderVisibleMinis()}catch(e){console.warn('preview assets unavailable',e);const c=document.querySelector('#previewCanvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#8a1f2d';x.font='19px sans-serif';x.textAlign='center';x.fillText('미리보기 리소스를 불러오지 못했습니다',220,220)}}
function currentColorHex(){const f=currentForm();return colorSel.value?(f?.colorHexById?.[colorSel.value]||null):null}
function previewModel(formId,variantId){const variants=previewData?.previews?.[formId];if(!variants)return null;const id=String(variantId??'0');return variants[id]||null}
function triangleTransform(s0,s1,s2,d0,d1,d2){const q=s0.x*(s1.y-s2.y)+s1.x*(s2.y-s0.y)+s2.x*(s0.y-s1.y);if(Math.abs(q)<1e-7)return null;return[(d0.x*(s1.y-s2.y)+d1.x*(s2.y-s0.y)+d2.x*(s0.y-s1.y))/q,(d0.y*(s1.y-s2.y)+d1.y*(s2.y-s0.y)+d2.y*(s0.y-s1.y))/q,(d0.x*(s2.x-s1.x)+d1.x*(s0.x-s2.x)+d2.x*(s1.x-s0.x))/q,(d0.y*(s2.x-s1.x)+d1.y*(s0.x-s2.x)+d2.y*(s1.x-s0.x))/q,(d0.x*(s1.x*s2.y-s2.x*s1.y)+d1.x*(s2.x*s0.y-s0.x*s2.y)+d2.x*(s0.x*s1.y-s1.x*s0.y))/q,(d0.y*(s1.x*s2.y-s2.x*s1.y)+d1.y*(s2.x*s0.y-s0.x*s2.y)+d2.y*(s0.x*s1.y-s1.x*s0.y))/q]}
function drawTexturedLayer(x,layer,worldToCanvas){const aw=atlasImage.naturalWidth||atlasImage.width,ah=atlasImage.naturalHeight||atlasImage.height,v=layer.v,u=layer.u,t=layer.t;for(let n=0;n<t.length;n+=3){const ids=[t[n],t[n+1],t[n+2]],d=ids.map(i=>worldToCanvas(v[i*2],v[i*2+1])),s=ids.map(i=>({x:u[i*2]*aw,y:u[i*2+1]*ah})),m=triangleTransform(s[0],s[1],s[2],d[0],d[1],d[2]);if(!m)continue;const minX=Math.max(0,Math.floor(Math.min(s[0].x,s[1].x,s[2].x)-1)),minY=Math.max(0,Math.floor(Math.min(s[0].y,s[1].y,s[2].y)-1)),maxX=Math.min(aw,Math.ceil(Math.max(s[0].x,s[1].x,s[2].x)+1)),maxY=Math.min(ah,Math.ceil(Math.max(s[0].y,s[1].y,s[2].y)+1));x.save();x.beginPath();x.moveTo(d[0].x,d[0].y);x.lineTo(d[1].x,d[1].y);x.lineTo(d[2].x,d[2].y);x.closePath();x.clip();x.transform(...m);x.drawImage(atlasImage,minX,minY,maxX-minX,maxY-minY,minX,minY,maxX-minX,maxY-minY);x.restore()}}
function renderModel(c,model,tint){const x=c.getContext('2d'),[minX,minY,maxX,maxY]=model.bounds,pad=.07,scale=Math.min(c.width*(1-pad*2)/Math.max(1,maxX-minX),c.height*(1-pad*2)/Math.max(1,maxY-minY)),toCanvas=(wx,wy)=>({x:(c.width-(maxX-minX)*scale)/2+(wx-minX)*scale,y:(c.height-(maxY-minY)*scale)/2+(maxY-wy)*scale}),tintLayer=tint?document.createElement('canvas'):null;if(tintLayer){tintLayer.width=c.width;tintLayer.height=c.height}const tx=tintLayer?.getContext('2d');for(const id of model.layers){const layer=previewData.layers[id];if(!layer)continue;if(tint&&layer.tint){tx.clearRect(0,0,c.width,c.height);drawTexturedLayer(tx,layer,toCanvas);tx.globalCompositeOperation='source-atop';tx.globalAlpha=.62;tx.fillStyle=tint;tx.fillRect(0,0,c.width,c.height);tx.globalCompositeOperation='source-over';tx.globalAlpha=1;x.globalAlpha=layer.a??1;x.drawImage(tintLayer,0,0);x.globalAlpha=1}else{x.globalAlpha=layer.a??1;drawTexturedLayer(x,layer,toCanvas);x.globalAlpha=1}}}
function drawAssembled(c,formId,variantId,tint){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!atlasImage||!previewData)return false;const model=previewModel(formId,variantId);if(!model)return false;const key=`${c.width}x${c.height}:${formId}:${variantId||'0'}:${tint||'default'}`;let rendered=previewCache.get(key);if(rendered){previewCache.delete(key);previewCache.set(key,rendered)}else{rendered=document.createElement('canvas');rendered.width=c.width;rendered.height=c.height;renderModel(rendered,model,tint);previewCache.set(key,rendered);previewCachePixels+=c.width*c.height;while(previewCachePixels>MAX_PREVIEW_CACHE_PIXELS&&previewCache.size>1){const oldestKey=previewCache.keys().next().value,oldest=previewCache.get(oldestKey);previewCache.delete(oldestKey);previewCachePixels-=oldest.width*oldest.height}}x.drawImage(rendered,0,0);return true}
function renderMini(c,formId,variantId,tint){if(!drawAssembled(c,formId,variantId,tint)){drawMiniPlaceholder(c,'미리보기 없음')}}
function renderPreview(){const c=document.querySelector('#previewCanvas'),x=c.getContext('2d');if(!atlasImage||!previewData){x.clearRect(0,0,c.width,c.height);x.fillStyle='#665';x.font='22px sans-serif';x.textAlign='center';x.fillText('미리보기 리소스 불러오는 중',220,220);return}if(!drawAssembled(c,formSel.value,variantSel.value,currentColorHex())){x.fillStyle='#665';x.font='20px sans-serif';x.textAlign='center';x.fillText('이 형상의 미리보기 없음',220,220)}}
async function init(){if(!streamer){msg('URL에 streamer 채널 ID가 없습니다.','err');return}if(token())loadPreviewAssets();await refreshCatalog(true);if(token())await loadViewerState();setInterval(()=>refreshCatalog(false),CATALOG_POLL_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshCatalog(false);loadViewerState()}})}
document.querySelector('#loginBtn').onclick=()=>location.href=`${API_BASE}/auth/chzzk/start?streamer=${encodeURIComponent(streamer)}`;
document.querySelector('#historyBtn').onclick=()=>setHistoryOpen(document.querySelector('#historyCard').hidden);
document.querySelector('#historyCloseBtn').onclick=()=>setHistoryOpen(false);
document.querySelector('#saveBtn').onclick=async()=>{const appearance={formId:formSel.value,variantId:variantSel.value||null,colorId:colorSel.value||null};const r=await fetch(`${API_BASE}/streamers/${encodeURIComponent(streamer)}/appearance/me`,{method:'PUT',cache:'no-store',headers:{'content-type':'application/json','authorization':`Bearer ${token()}`},body:JSON.stringify({appearance})});const e=document.querySelector('#saveStatus');if(r.ok){viewerState=await r.json();e.className='ok';e.textContent=`저장되었습니다. (수정 ${viewerState.revision}회차)`;renderViewerState()}else{e.className='err';e.textContent='저장 실패: '+JSON.stringify(await r.json())}};
init().catch(e=>msg('오류: '+e.message,'err'));
</script>
