<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Lamb</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#faf8f2;color:#222}
    .card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin:16px 0}
    button{font:inherit;cursor:pointer;font-weight:700}
    .muted{color:#666}.ok{color:#157347}.err{color:#b02a37}
    .picker-section{margin:0 0 22px}.picker-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:18px}
    .picker-help{font-size:12px;color:#777;margin:-3px 0 9px}
    .choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;max-height:280px;overflow:auto;padding:3px 5px 3px 3px;scrollbar-gutter:stable}
    .choice{position:relative;display:flex;align-items:center;justify-content:center;min-height:66px;border:2px solid transparent;border-radius:11px;background:#eee8dc;color:#392f25;padding:9px;box-sizing:border-box;text-align:center;transition:border-color .12s ease,transform .12s ease,background .12s ease}
    .choice:hover{border-color:#e8b54e;transform:translateY(-1px)}.choice.selected{border-color:#ff3b1f;box-shadow:0 0 0 1px #ff3b1f inset;background:#fff8ed}
    .choice.selected::after{content:'✓';position:absolute;top:5px;right:7px;font-size:12px;font-weight:900;color:#ff3b1f}
    .choice.dark{background:#2b2b2b;color:#fff}.choice.dark.selected{background:#333}
    .choice.swatch{flex-direction:column;gap:7px;min-height:88px}
    .choice.has-preview{flex-direction:column;gap:5px;min-height:112px}.choice-preview{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
    .swatch-chip{width:58px;height:43px;border-radius:9px;border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
    .swatch-chip.default{background:linear-gradient(135deg,#eee8dc 0 25%,#d6cec0 25% 50%,#eee8dc 50% 75%,#d6cec0 75%)}
    .label{font-size:12px;line-height:1.25;word-break:keep-all}
    .selection-summary{background:#faf8f2;border:1px solid #e4ded2;border-radius:10px;padding:10px 12px;margin:4px 0 12px;font-size:13px}
    #saveBtn,#loginBtn{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:9px;background:#fff}
    #saveBtn{background:#2f2922;color:#fff;border-color:#2f2922}
    .identity{font-size:20px;font-weight:800;margin:0 0 6px}.eligibility{padding:10px;border-radius:9px;background:#eef8ef}.eligibility.locked{background:#fff0f0}
    .preview{display:grid;place-items:center;min-height:230px;overflow:hidden;background:radial-gradient(circle,#f7e9cb,#cbb58e);border-radius:12px;margin-bottom:18px}
    #previewCanvas{width:220px;height:220px;image-rendering:auto}.history-item{border-top:1px solid #eee;padding:13px 0}.history-item:first-child{border-top:0}.history-events{font-size:13px;color:#555}.copyBtn{padding:6px 9px;border:1px solid #bbb;border-radius:7px;background:#fff}
    @media(max-width:520px){body{padding:14px}.card{padding:15px}.choice-grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}.swatch-chip{width:48px;height:38px}}
  </style>
</head>
<body>
  <h1>My Lamb</h1>
  <p class="muted">방송에서 당첨되었을 때 사용할 내 신도 외형을 미리 저장합니다.</p>
  <div id="status" class="card">초기화 중...</div>
  <div id="login" class="card" hidden><button id="loginBtn">치지직으로 로그인</button></div>
  <div id="editor" class="card" hidden>
    <p id="followerName" class="identity"></p><p id="eligibility" class="eligibility"></p>
    <div class="preview"><canvas id="previewCanvas" width="440" height="440"></canvas></div>
    <section class="picker-section">
      <div class="picker-title"><strong>형상 선택</strong><span id="formCount" class="muted"></span></div>
      <p class="picker-help">사용할 신도의 형상을 이름으로 선택합니다.</p>
      <div id="formGrid" class="choice-grid"></div>
    </section>
    <section class="picker-section">
      <div class="picker-title"><strong>색 선택</strong><span id="colorCount" class="muted"></span></div>
      <p class="picker-help">게임에서 읽은 실제 색상값을 색상칩으로 표시합니다.</p>
      <div id="colorGrid" class="choice-grid"></div>
    </section>
    <section class="picker-section">
      <div class="picker-title"><strong>종류 선택</strong><span id="variantCount" class="muted"></span></div>
      <p class="picker-help">형상에 존재하는 종류 번호를 선택합니다.</p>
      <div id="variantGrid" class="choice-grid"></div>
    </section>
    <select id="form" hidden></select><select id="variant" hidden></select><select id="color" hidden></select>
    <p id="optionHint" class="selection-summary"></p>
    <button id="saveBtn">이 외형으로 저장</button>
    <p id="saveStatus"></p>
  </div>
  <div id="historyCard" class="card" hidden><h2>신도 히스토리</h2><div id="history"></div></div>
<script>
const API_BASE='__API_BASE__';
const PREVIEW_ASSET_BASE='__PREVIEW_ASSET_BASE__';
const CATALOG_POLL_MS=15000;
const qs=new URLSearchParams(location.search),streamer=qs.get('streamer');
const fragment=new URLSearchParams(location.hash.slice(1));
if(fragment.get('token')){sessionStorage.setItem('viewerToken',fragment.get('token'));history.replaceState({},'',location.pathname+location.search)}
const token=()=>sessionStorage.getItem('viewerToken');
const status=document.querySelector('#status'),login=document.querySelector('#login'),editor=document.querySelector('#editor');
const formSel=document.querySelector('#form'),variantSel=document.querySelector('#variant'),colorSel=document.querySelector('#color');
const formGrid=document.querySelector('#formGrid'),variantGrid=document.querySelector('#variantGrid'),colorGrid=document.querySelector('#colorGrid');
let catalog={forms:[]},catalogFingerprint='',loadingCatalog=false,viewerState={canCreate:true,nextGeneration:1,history:[]},atlasRegions=null,atlasImage=null;
const FORM_KO={Anteater:'개미핥기',Bee:'벌',Camel:'낙타',Cat:'고양이',Deer:'사슴',Deer_ritual:'사슴 (의식)',Dog:'개',Enchida:'가시두더지',Echidna:'가시두더지',Fox:'여우',Goldfish:'금붕어',Gorilla:'고릴라',Hammerhead:'귀상어',Hedgehog:'고슴도치',LadyBug:'무당벌레',Ladybug:'무당벌레',Llama:'라마',Monkey:'원숭이',Moose:'말코손바닥사슴',Mosquito:'모기',Narwal:'일각고래',Narwhal:'일각고래',Panda:'판다',Pig:'돼지',Possum:'주머니쥐',Skunk:'스컹크',Sphynx:'스핑크스 고양이',Tapir:'맥',Tiger:'호랑이',Turtle:'거북이'};
function msg(t,c=''){status.className='card '+c;status.textContent=t}
function koreanFormName(f){return FORM_KO[f.formId]||FORM_KO[f.displayName]||f.displayName||f.formId}
function optionLabel(kind,id,index){const n=Number(id);if(kind==='variant')return Number.isInteger(n)&&String(n)===String(id)?`종류 ${n+1}`:`종류 ${index+1}`;if(kind==='color')return Number.isInteger(n)&&String(n)===String(id)?`색상 ${n+1}`:`색상 ${index+1}`;return String(id)}
function normalizeCatalog(raw){const rawForms=raw.forms||raw.Forms||[],allowedRaw=raw.allowedFormIds||raw.AllowedFormIds||[];const forms=rawForms.map(x=>({formId:String(x.formId??x.FormId??''),displayName:x.displayName??x.DisplayName??'',isUnlocked:x.isUnlocked??x.IsUnlocked??true,isSpecial:x.isSpecial??x.IsSpecial??false,isModded:x.isModded??x.IsModded??false,variantIds:(x.variantIds??x.VariantIds??[]).map(String),colorIds:(x.colorIds??x.ColorIds??[]).map(String),colorHexById:x.colorHexById??x.ColorHexById??{}})).filter(x=>x.formId);return {...raw,forms,allowedFormIds:allowedRaw.map(String),saveId:raw.saveId??raw.SaveId??'unknown'}}
function fingerprint(c){return JSON.stringify({s:c.saveId,a:c.allowedFormIds,f:c.forms.map(x=>[x.formId,x.displayName,x.isUnlocked,x.isSpecial,x.isModded,x.variantIds,x.colorIds,x.colorHexById])})}
function allowedForms(){const allowed=new Set((catalog.allowedFormIds||[]).map(String));return (catalog.forms||[]).filter(x=>x.isUnlocked&&allowed.has(x.formId))}
function makeChoice(label,selected,onClick,{dark=false,color=null,defaultSwatch=false,preview=null}={}){const b=document.createElement('button');b.type='button';b.className='choice'+(dark?' dark':'')+((color||defaultSwatch)?' swatch':'')+(preview?' has-preview':'')+(selected?' selected':'');b.setAttribute('aria-pressed',selected?'true':'false');if(preview){const canvas=document.createElement('canvas');canvas.width=144;canvas.height=144;canvas.className='choice-preview';b.appendChild(canvas);requestAnimationFrame(()=>preview(canvas))}if(color||defaultSwatch){const chip=document.createElement('div');chip.className='swatch-chip'+(defaultSwatch?' default':'');if(color)chip.style.background=color;b.appendChild(chip)}const t=document.createElement('span');t.className='label';t.textContent=label;b.appendChild(t);b.onclick=onClick;return b}
function currentForm(){return (catalog.forms||[]).find(x=>x.formId===formSel.value)}
function renderForms(){formGrid.innerHTML='';const forms=allowedForms();document.querySelector('#formCount').textContent=`${forms.length}개`;forms.forEach(f=>formGrid.appendChild(makeChoice(koreanFormName(f),formSel.value===f.formId,()=>{formSel.value=f.formId;const next=(catalog.forms||[]).find(x=>x.formId===f.formId);variantSel.value=(next?.variantIds||[])[0]||'';colorSel.value='';renderAll()},{preview:c=>renderMini(c,f.formId,(f.variantIds||[])[0]||'0',null)})))}
function renderColors(){colorGrid.innerHTML='';const f=currentForm(),ids=f?.colorIds||[];document.querySelector('#colorCount').textContent=`${ids.length}색`;colorGrid.appendChild(makeChoice('게임 기본',!colorSel.value,()=>{colorSel.value='';renderAll()},{dark:true,defaultSwatch:true,preview:c=>renderMini(c,f?.formId,variantSel.value,null)}));ids.forEach((id,i)=>{const hex=f?.colorHexById?.[id]||null;colorGrid.appendChild(makeChoice(optionLabel('color',id,i),colorSel.value===id,()=>{colorSel.value=id;renderAll()},{dark:true,color:hex,preview:c=>renderMini(c,f?.formId,variantSel.value,hex)}))})}
function renderVariants(){variantGrid.innerHTML='';const f=currentForm(),ids=f?.variantIds||[];document.querySelector('#variantCount').textContent=`${ids.length}개`;if(ids.length&&!ids.includes(variantSel.value))variantSel.value=ids[0];ids.forEach((id,i)=>variantGrid.appendChild(makeChoice(`종류 ${i+1}`,variantSel.value===id,()=>{variantSel.value=id;renderAll()},{preview:c=>renderMini(c,f?.formId,id,currentColorHex())})))}
function renderAll(){renderForms();renderColors();renderVariants();const f=currentForm();document.querySelector('#optionHint').textContent=f?`현재 선택: ${koreanFormName(f)} · ${colorSel.value?optionLabel('color',colorSel.value,Number(colorSel.value)||0):'게임 기본 색상'} · ${(()=>{const ids=f?.variantIds||[];const i=ids.indexOf(variantSel.value);return i>=0?`종류 ${i+1}`:'종류 없음'})()}`:'';renderPreview()}
function renderCatalog(next,changed=false){const forms=(()=>{catalog=next;return allowedForms()})();const pf=formSel.value,pv=variantSel.value,pc=colorSel.value;if(!forms.length){editor.hidden=true;msg(`현재 선택 가능한 외형이 없습니다. (수신 forms=${next.forms.length}, allowed=${(next.allowedFormIds||[]).length})`,'err');return}formSel.innerHTML='';forms.forEach(f=>{const o=document.createElement('option');o.value=f.formId;o.textContent=koreanFormName(f);formSel.appendChild(o)});if(pf&&forms.some(f=>f.formId===pf))formSel.value=pf;const f=currentForm();variantSel.innerHTML='<option value=""></option>';(f?.variantIds||[]).forEach(v=>{const o=document.createElement('option');o.value=v;variantSel.appendChild(o)});colorSel.innerHTML='<option value=""></option>';(f?.colorIds||[]).forEach(v=>{const o=document.createElement('option');o.value=v;colorSel.appendChild(o)});if(pv&&[...variantSel.options].some(o=>o.value===pv))variantSel.value=pv;else if((f?.variantIds||[]).length)variantSel.value=f.variantIds[0];if(pc&&[...colorSel.options].some(o=>o.value===pc))colorSel.value=pc;renderAll();if(!token()){editor.hidden=true;login.hidden=false;msg(`선택 가능 외형 ${forms.length}개 · 목록 자동 갱신 중`);return}login.hidden=true;editor.hidden=false;msg(changed?`외형 목록이 갱신되었습니다. 선택 가능 ${forms.length}개`:`선택 가능 외형 ${forms.length}개 · 자동 갱신 중`,'ok')}
async function refreshCatalog(initial=false){if(!streamer||loadingCatalog)return;loadingCatalog=true;try{const r=await fetch(`${API_BASE}/streamers/${encodeURIComponent(streamer)}/catalog`,{cache:'no-store'});if(!r.ok){if(initial){editor.hidden=true;msg('스트리머의 외형 목록이 아직 업로드되지 않았습니다. 게임과 Companion을 먼저 실행해 주세요. 자동으로 다시 확인합니다.','err')}return}const next=normalizeCatalog(await r.json()),fp=fingerprint(next),changed=!!catalogFingerprint&&fp!==catalogFingerprint;if(initial||fp!==catalogFingerprint){catalogFingerprint=fp;renderCatalog(next,changed)}}catch(e){if(initial)msg('외형 목록 조회 오류: '+e.message+' · 자동으로 다시 확인합니다.','err')}finally{loadingCatalog=false}}
function viewerNickname(){try{return JSON.parse(atob(token().split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).nickname||'시청자'}catch{return '시청자'}}
function displayName(){const g=Number(viewerState.nextGeneration||1),n=viewerNickname();return g<=1?n:`${n} ${g}세`}
async function loadViewerState(){if(!token())return;const r=await fetch(`${API_BASE}/streamers/${encodeURIComponent(streamer)}/appearance/me`,{cache:'no-store',headers:{authorization:`Bearer ${token()}`}});if(!r.ok)throw new Error('신도 상태 조회 실패');viewerState=await r.json();const saved=viewerState.appearance;if(saved){formSel.value=saved.formId||formSel.value;renderCatalog(catalog);variantSel.value=saved.variantId||'';colorSel.value=saved.colorId||'';renderAll()}renderViewerState()}
function renderViewerState(){const can=viewerState.canCreate!==false;document.querySelector('#followerName').textContent=`신도 이름 : ${displayName()}`;const el=document.querySelector('#eligibility');el.className='eligibility'+(can?'':' locked');el.textContent=can?'새 신도를 생성할 수 있습니다. 저장된 최신 외형이 래플 당첨 시 사용됩니다.':'현재 세대의 사망이 확정되기 전에는 새 신도를 생성할 수 없습니다.';document.querySelector('#saveBtn').disabled=!can;const box=document.querySelector('#history'),card=document.querySelector('#historyCard');box.innerHTML='';const items=viewerState.history||[];card.hidden=!items.length;items.forEach(h=>{const d=document.createElement('div');d.className='history-item';const events=(h.events||[]).map(e=>`${e.type==='Created'?'생성됨':e.type==='Died'?'사망함':e.type==='Resurrected'?'부활함':e.type} · ${new Date(e.at).toLocaleString()}${e.cause?' · '+e.cause:''}`).join('<br>');const lived=(h.events||[]).length?`<br>누적 생존 기간: ${formatDuration(livingDuration(h.events,h.isAlive))}`:'';const look=h.appearance?`<br>외형: ${escapeHtml(h.appearance.formId)} / 색 ${escapeHtml(h.appearance.colorId??'기본')} / 종류 ${escapeHtml(h.appearance.variantId??'기본')}`:'';d.innerHTML=`<strong>${escapeHtml(h.followerName||`${h.generation}세`)}</strong><p class="history-events">${events}${lived}${look}</p>`;if(h.appearance){const b=document.createElement('button');b.className='copyBtn';b.textContent='이 외형을 현재 설정으로 복사';b.onclick=()=>copyAppearance(h.appearance);d.appendChild(b)}box.appendChild(d)})}
function livingDuration(events,isAlive){let start=null,total=0;[...(events||[])].sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(e=>{if((e.type==='Created'||e.type==='Resurrected')&&start===null)start=new Date(e.at).getTime();else if(e.type==='Died'&&start!==null){total+=Math.max(0,new Date(e.at).getTime()-start);start=null}});if(isAlive&&start!==null)total+=Math.max(0,Date.now()-start);return total}
function formatDuration(ms){const days=Math.max(0,Math.floor(ms/86400000)),hours=Math.max(0,Math.floor(ms%86400000/3600000));return `${days}일 ${hours}시간`}
function escapeHtml(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}
function copyAppearance(a){if(viewerState.canCreate===false)return;formSel.value=a.formId||formSel.value;renderCatalog(catalog);variantSel.value=a.variantId||'';colorSel.value=a.colorId||'';renderAll();document.querySelector('#saveStatus').textContent='이전 세대 외형을 불러왔습니다. 저장 버튼을 눌러 확정하세요.'}
async function loadPreviewAssets(){try{const [txt,img]=await Promise.all([fetch(`${PREVIEW_ASSET_BASE}/Follower.atlas.bytes`).then(r=>{if(!r.ok)throw new Error(`atlas ${r.status}`);return r.text()}),new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=`${PREVIEW_ASSET_BASE}/Follower.png`})]);atlasImage=img;atlasRegions=parseAtlas(txt);if((catalog.forms||[]).length)renderAll();else renderPreview()}catch(e){console.warn('preview assets unavailable',e)}}
function parseAtlas(t){const lines=t.split(/\r?\n/),out=[];for(let i=0;i<lines.length;i++){const name=lines[i].trim();if(!name||name.includes(':')||name==='Follower.png')continue;let xy=null,size=null,rot=false;for(let j=i+1;j<Math.min(i+8,lines.length)&&/^\s/.test(lines[j]);j++){const s=lines[j].trim();if(s.startsWith('xy:'))xy=s.slice(3).split(',').map(Number);if(s.startsWith('size:'))size=s.slice(5).split(',').map(Number);if(s==='rotate: true')rot=true}if(xy&&size)out.push({name,xy,size,rot})}return out}
function norm(s){return String(s||'').replace(/[^a-z0-9]/gi,'').toLowerCase()}
function currentColorHex(){const f=currentForm();return colorSel.value?(f?.colorHexById?.[colorSel.value]||null):null}
function headRegions(formId,variantId){if(!atlasRegions)return[];const key=norm(formId),v=Math.max(0,Number(variantId)||0),suffix=v?String(v+1):'';const all=atlasRegions.filter(r=>r.name.startsWith('Head/')&&norm(r.name).includes('head'+key));const exact=all.filter(r=>{const m=r.name.match(/(?:_Btm|_Top|_Markings)(\d*)$/i);return m&&(m[1]||'')===suffix});return (exact.length?exact:all.filter(r=>!/(?:_Btm|_Top|_Markings)\d+$/i.test(r.name))).sort((a,b)=>layerOrder(a.name)-layerOrder(b.name))}
function layerOrder(n){if(/Back/i.test(n))return 0;if(/Btm/i.test(n))return 1;if(/Markings/i.test(n))return 2;if(/Top/i.test(n))return 3;return 2}
function regionCanvas(r,tint){const [sw,sh]=r.size,out=document.createElement('canvas');out.width=sw;out.height=sh;const x=out.getContext('2d');if(r.rot){x.translate(0,sh);x.rotate(-Math.PI/2);x.drawImage(atlasImage,r.xy[0],r.xy[1],sh,sw,0,0,sh,sw)}else x.drawImage(atlasImage,r.xy[0],r.xy[1],sw,sh,0,0,sw,sh);if(tint){x.globalCompositeOperation='source-atop';x.globalAlpha=.55;x.fillStyle=tint;x.fillRect(0,0,out.width,out.height)}return out}
function drawRegion(x,r,cx,cy,maxW,maxH,tint){const img=regionCanvas(r,tint),scale=Math.min(maxW/img.width,maxH/img.height);x.drawImage(img,cx-img.width*scale/2,cy-img.height*scale/2,img.width*scale,img.height*scale)}
function drawAssembled(c,formId,variantId,tint,mini=false){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!atlasImage||!atlasRegions)return false;const body=atlasRegions.find(r=>r.name==='Body/BodyFollowerRags')||atlasRegions.find(r=>r.name==='Body/BodyFollowerUp'),heads=headRegions(formId,variantId),unit=c.width/440;if(body)drawRegion(x,body,c.width/2,c.height*.70,c.width*.42,c.height*.42,tint);if(heads.length){heads.forEach(r=>drawRegion(x,r,c.width/2,c.height*.40,c.width*(mini?.72:.68),c.height*(mini?.58:.52),tint));return true}return false}
function renderMini(c,formId,variantId,tint){if(!drawAssembled(c,formId,variantId,tint,true)){const x=c.getContext('2d');x.fillStyle='#766';x.textAlign='center';x.font='14px sans-serif';x.fillText('미리보기 없음',72,76)}}
function renderPreview(){const c=document.querySelector('#previewCanvas'),x=c.getContext('2d');if(!atlasImage||!atlasRegions){x.clearRect(0,0,c.width,c.height);x.fillStyle='#665';x.font='24px sans-serif';x.textAlign='center';x.fillText('미리보기 준비 중',220,220);return}if(!drawAssembled(c,formSel.value,variantSel.value,currentColorHex())){x.fillStyle='#665';x.font='20px sans-serif';x.textAlign='center';x.fillText('이 형상의 아틀라스 영역 없음',220,220)}}
async function init(){if(!streamer){msg('URL에 streamer 채널 ID가 없습니다.','err');return}loadPreviewAssets();await refreshCatalog(true);if(token())await loadViewerState();setInterval(()=>refreshCatalog(false),CATALOG_POLL_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshCatalog(false);loadViewerState()}})}
document.querySelector('#loginBtn').onclick=()=>location.href=`${API_BASE}/auth/chzzk/start?streamer=${encodeURIComponent(streamer)}`;
document.querySelector('#saveBtn').onclick=async()=>{const appearance={formId:formSel.value,variantId:variantSel.value||null,colorId:colorSel.value||null};const r=await fetch(`${API_BASE}/streamers/${encodeURIComponent(streamer)}/appearance/me`,{method:'PUT',cache:'no-store',headers:{'content-type':'application/json','authorization':`Bearer ${token()}`},body:JSON.stringify({appearance})});const e=document.querySelector('#saveStatus');if(r.ok){viewerState=await r.json();e.className='ok';e.textContent=`저장되었습니다. (수정 ${viewerState.revision}회차)`;renderViewerState()}else{e.className='err';e.textContent='저장 실패: '+JSON.stringify(await r.json())}};
init().catch(e=>msg('오류: '+e.message,'err'));
</script>
</body>
</html>
