AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: COTL CHZZK Companion viewer appearance service

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - prod
  TokenSigningSecret:
    Type: String
    NoEcho: true
    Default: ''

Conditions:
  GenerateTokenSigningSecret: !Equals [!Ref TokenSigningSecret, '']

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256

Resources:
  GeneratedTokenSigningSecret:
    Type: AWS::SecretsManager::Secret
    Condition: GenerateTokenSigningSecret
    Properties:
      Description: !Sub COTL ${EnvironmentName} session token signing secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  AppearanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ExpiresAt
        Enabled: true

  Api:
    Type: AWS::Serverless::HttpApi

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppearanceTable
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cotl/${EnvironmentName}/chzzk/companion/client-id
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cotl/${EnvironmentName}/chzzk/mylamb/client-id
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/cotl/${EnvironmentName}/chzzk/companion-*
                - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/cotl/${EnvironmentName}/chzzk/mylamb-*
      Environment:
        Variables:
          TABLE_NAME: !Ref AppearanceTable
          COTL_CONFIG_PROVIDER: aws
          COTL_SSM_COMPANION_CLIENT_ID_PARAM: !Sub /cotl/${EnvironmentName}/chzzk/companion/client-id
          COTL_SSM_MYLAMB_CLIENT_ID_PARAM: !Sub /cotl/${EnvironmentName}/chzzk/mylamb/client-id
          COTL_SECRET_COMPANION_ID: !Sub /cotl/${EnvironmentName}/chzzk/companion
          COTL_SECRET_MYLAMB_ID: !Sub /cotl/${EnvironmentName}/chzzk/mylamb
          TOKEN_SIGNING_SECRET: !If
            - GenerateTokenSigningSecret
            - !Sub '{{resolve:secretsmanager:${GeneratedTokenSigningSecret}:SecretString}}'
            - !Ref TokenSigningSecret
          COTL_ENVIRONMENT: !Ref EnvironmentName
          FRONTEND_URL: !Sub https://${FrontendDistribution.DomainName}
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  EnvironmentName:
    Value: !Ref EnvironmentName
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  CompanionOAuthCallbackUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/auth/companion/callback
  ViewerOAuthCallbackUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/auth/chzzk/callback
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendUrl:
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
