<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LambLink Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
iframe{display:block;border:0;width:100%;height:100%;visibility:hidden}
</style>
</head>
<body>
<iframe id="overlay" title="LambLink 오버레이"></iframe>
<script>
// Keep this document local: navigating it to HTTP would lose recovery on a cold start.
const serverOrigin='http://127.0.0.1:17883';
const frame=document.getElementById('overlay');
const retryMs=3000, staleMs=4000;
let lastHeartbeat=null, lastAttempt=-Infinity;
window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow || event.origin!==serverOrigin ||
     event.data?.type!=='lamblink-overlay-rendered')return;
  lastHeartbeat=performance.now();
  frame.style.visibility='visible';
});
function recover(){
  const now=performance.now();
  if(lastHeartbeat!==null && now-lastHeartbeat<staleMs)return;
  // Never expose a browser error page or stale event while disconnected.
  frame.style.visibility='hidden';
  if(now-lastAttempt<retryMs)return;
  lastHeartbeat=null;
  lastAttempt=now;
  frame.src=serverOrigin+'/overlay?bootstrap=local-v1&retry='+Date.now();
}
setInterval(recover,500);
recover();
</script>
</body>
</html>
